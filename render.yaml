services:
  - type: web
    name: akomp-yug
    runtime: node
    buildCommand: npm ci --only=production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: akomp-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: akomp-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: akomp-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: akomp-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: akomp-postgres
          property: password

databases:
  - name: akomp-postgres
    plan: free